[project]
name = "mamarmiton"
version = "4.1.0"
description = "Carnet de recettes de bureau, avec import de PDF par IA locale"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2",
    "pdfplumber>=0.11",
    "pillow>=10",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local AI parsing of PDFs. On machines without a C++ compiler, install from
# the prebuilt CPU wheels:
#   pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
ai = ["llama-cpp-python>=0.3"]
# Reading scanned PDFs (also needs the Tesseract and Poppler programs)
ocr = ["pdf2image>=1.17", "pytesseract>=0.3"]
# PyInstaller 6.9+: the in-app update restarts the one-file build with PYINSTALLER_RESET_ENVIRONMENT
dev = ["pytest>=8", "pyinstaller>=6.9"]

[project.scripts]
mamarmiton = "mamarmiton.ui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mamarmiton*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
