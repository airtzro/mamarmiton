[project]
name = "mamarmiton-server"
version = "0.1.0"
description = "Serveur Mamarmiton : comptes, carnets de recettes personnels et partage"
requires-python = ">=3.11"
# also needs the desktop app's `mamarmiton` package (recipe model only), installed
# with --no-deps from the repository root so the server does not pull in the UI
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "argon2-cffi>=23.1",
    "pillow>=10",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mamarmiton_server*"]

[tool.setuptools.package-data]
mamarmiton_server = ["web/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
