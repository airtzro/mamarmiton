# Mamarmiton server for OpenMediaVault (compose plugin) or any Docker host.
# 1. copy .env.example to .env and fill it in
# 2. docker compose up -d --build
# 3. docker compose exec api python -m mamarmiton_server create-admin <your-name>
# See server/README.md for the router and DuckDNS steps.

services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        # 0 = leave out the local model's library (the import then uses the rule-based reader only)
        WITH_LLM: ${IMPORT_WITH_LLM:-1}
    restart: unless-stopped
    # the owner of DATA_DIR on the NAS (OMV: your user's uid, group "users" = 100)
    user: "${PUID:-1000}:${PGID:-100}"
    volumes:
      - ${DATA_DIR:-./data}:/data
    environment:
      MAMARMITON_SERVER_DATA: /data
      # refuse desktop apps older than this (answer 426 "mettez à jour"); empty = accept all
      MAMARMITON_MIN_DESKTOP_VERSION: ${MIN_DESKTOP_VERSION:-}
      # import automatique (files -> recipe), all on this server: see README "Import automatique"
      # empty = DATA_DIR/models/qwen2.5-1.5b-instruct-q4_0.gguf (optional; without it, rule-based reading)
      MAMARMITON_IMPORT_MODEL_PATH: ${IMPORT_MODEL_PATH:-}
      MAMARMITON_IMPORT_MAX_MB: ${IMPORT_MAX_MB:-30}
      MAMARMITON_IMPORT_DAILY: ${IMPORT_DAILY:-40}
      MAMARMITON_IMPORT_DAILY_ALL: ${IMPORT_DAILY_ALL:-300}
      MAMARMITON_IMPORT_TIMEOUT_S: ${IMPORT_TIMEOUT_S:-240}
    # no "ports:": only Caddy can reach the API (it trusts Caddy's X-Forwarded-For)
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  caddy:
    build: ./caddy
    restart: unless-stopped
    depends_on: [api]
    ports:
      # OMV's own web interface usually takes 80/443 on the NAS, so use another
      # port here and forward the router's public 443 to it
      - "${HTTPS_PORT:-8443}:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?set DUCKDNS_TOKEN in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # certificates
      - caddy_config:/config
    networks: [internal]
    security_opt: ["no-new-privileges:true"]

  # keeps <name>.duckdns.org pointing at the home's public IP
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:?set DUCKDNS_SUBDOMAIN in .env}
      TOKEN: ${DUCKDNS_TOKEN}
      TZ: ${TZ:-Europe/Paris}
      LOG_FILE: "false"

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
