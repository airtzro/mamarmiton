name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-exe:
    name: Build recette.exe
    runs-on: windows-latest
    permissions:
      contents: write  # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # No llama-cpp-python: the AI is optional and recette.spec copes without it.
      - name: Install
        run: pip install -e ".[dev]"
      # Tk works natively on Windows (no virtual display needed).
      - name: Test (desktop)
        run: python -m pytest -q
      - name: Build
        run: pyinstaller recette.spec
      - name: Check the exe exists
        run: if (-not (Test-Path dist/recette.exe)) { throw "dist/recette.exe missing" }
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: recette-exe
          path: dist/recette.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/recette.exe
          generate_release_notes: true

  linux-binary:
    name: Build the Linux binary
    # The binary needs a glibc at least as new as the build machine's (Ubuntu 24.04: 2.39).
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The distribution's Python and Tk: its Tk draws fonts with Xft (setup-python's does not).
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y python3-venv python3-tk xvfb
      - name: Build
        run: xvfb-run -a packaging/linux/build.sh
      - name: Test (desktop)
        run: xvfb-run -a build/linux-venv/bin/python -m pytest -q
      - name: Check the binary starts
        run: |
          export MAMARMITON_DATA_DIR="$RUNNER_TEMP/mm-data"
          xvfb-run -a timeout 20 dist/mamarmiton & sleep 15
          grep -q "starting" "$MAMARMITON_DATA_DIR/mamarmiton.log"
          ! grep -q "Startup failed" "$MAMARMITON_DATA_DIR/mamarmiton.log"
      - name: Name the asset
        run: mv dist/mamarmiton dist/mamarmiton-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: mamarmiton-linux
          path: dist/mamarmiton-linux-x86_64
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mamarmiton-linux-x86_64
