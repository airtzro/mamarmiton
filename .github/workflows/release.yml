name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-exe:
    name: Build recette.exe
    runs-on: windows-latest
    permissions:
      contents: write  # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # No llama-cpp-python: the AI is optional and recette.spec copes without it.
      - name: Install
        run: pip install -e ".[dev]"
      # Tk works natively on Windows (no virtual display needed).
      - name: Test (desktop)
        run: python -m pytest -q
      - name: Build
        run: pyinstaller recette.spec
      - name: Check the exe exists
        run: if (-not (Test-Path dist/recette.exe)) { throw "dist/recette.exe missing" }
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: recette-exe
          path: dist/recette.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/recette.exe
          generate_release_notes: true
